<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3378ef">
    <title>CivicLens is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f8fa; color: #17212b; font: 16px system-ui, sans-serif; text-align: center; }
      main { max-width: 420px; padding: 32px; border: 1px solid #e7ebef; border-radius: 14px; background: #fff; }
      h1 { margin-top: 0; font-size: 24px; }
      p { color: #75808c; line-height: 1.6; }
      button { border: 0; border-radius: 7px; padding: 11px 16px; background: #3378ef; color: #fff; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>CivicLens cannot reach the server right now. Reconnect to submit reports, sign in, or load live complaint updates.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
